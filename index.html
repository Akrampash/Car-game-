<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight Highway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --night: #0a0c11;
  --asphalt: #171a22;
  --verge: #0f1218;
  --paint: #f2c94c;
  --signal: #ff4a3a;
  --ink: #eceff5;
  --mute: #8b94a8;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--night); }
body {
  margin: 0;
  font-size: 14px;
  color: var(--ink);
  font-family: var(--font-data);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
}
.game { width: min(100%, calc((100dvh - 210px) * 0.6)); min-width: 260px; display: flex; flex-direction: column; gap: 10px; }
.hud { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat span { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); }
.stat b { font-family: var(--font-display); font-weight: 900; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat:nth-child(2) { text-align: center; }
.stat:nth-child(3) { text-align: right; }
.stat:first-child b { color: var(--paint); }
.stage { position: relative; width: 100%; aspect-ratio: 3 / 5; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--verge); outline: 1px solid #262b38; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px; text-align: center; background: rgba(10, 12, 17, 0.78);
}
.overlay[hidden] { display: none; }
.overlay h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(40px, 12vw, 64px); line-height: 0.9; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
.overlay h1 em { font-style: normal; color: var(--paint); }
.overlay p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--mute); max-width: 30ch; }
.overlay p strong { color: var(--ink); font-weight: 600; }
.go {
  appearance: none; border: 0; cursor: pointer; font-family: var(--font-display); font-weight: 900; font-size: 24px;
  letter-spacing: 0.06em; text-transform: uppercase; color: #1a1400; background: var(--paint);
  padding: 12px 34px; border-radius: 4px;
}
.go:hover { filter: brightness(1.08); }
.go:focus-visible, .pad:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.pads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pad {
  appearance: none; border: 1px solid #2a3040; background: var(--asphalt); color: var(--ink); cursor: pointer;
  font-family: var(--font-display); font-weight: 800; font-size: 26px; padding: 12px; border-radius: 6px;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad:active { background: #222836; }
.hint { margin: 0; text-align: center; font-size: 11px; color: var(--mute); letter-spacing: 0.04em; }
@media (prefers-reduced-motion: reduce) { .go { transition: none; } }
</style>
</head>
<body>
<main class="game">
  <section class="hud" aria-label="Scoreboard">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Speed km/h</span><b id="speed">0</b></div>
    <div class="stat"><span>Best</span><b id="best">0</b></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Endless highway driving game"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="ovTitle">Midnight <em>Highway</em></h1>
      <p id="ovText">Weave through traffic on a four-lane road. Grab <strong>coins</strong>. The longer you last, the faster it gets.</p>
      <button class="go" id="goBtn" type="button">Start</button>
    </div>
  </div>

  <div class="pads">
    <button class="pad" id="padL" type="button" aria-label="Move left">&larr; Left</button>
    <button class="pad" id="padR" type="button" aria-label="Move right">Right &rarr;</button>
  </div>
  <p class="hint">Arrow keys or A / D to steer &middot; P to pause &middot; Swipe on the road</p>
</main>

<script>
(function () {
  var W = 360, H = 600, ROAD_X = 40, LANES = 4, LANE_W = 70;
  var CAR_W = 40, CAR_H = 70, PLAYER_Y = 470;
  var css = getComputedStyle(document.documentElement);
  function tok(n) { return css.getPropertyValue(n).trim(); }
  var C = { asphalt: tok('--asphalt'), verge: tok('--verge'), paint: tok('--paint'), signal: tok('--signal'), ink: tok('--ink') };

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var elScore = document.getElementById('score');
  var elSpeed = document.getElementById('speed');
  var elBest = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var goBtn = document.getElementById('goBtn');

  var best = 0;
  try { best = parseInt(localStorage.getItem('midnight-highway-best'), 10) || 0; } catch (e) {}
  elBest.textContent = best;

  function laneX(i) { return ROAD_X + LANE_W * (i + 0.5); }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  var BODY_COLORS = ['#3d7bff', '#2fb5a0', '#9b6bff', '#e8e8ee', '#ff8f3a', '#4ac26b'];

  var mode = 'ready';
  var player, cars, coins, particles, laneSpeed, offset, roadside;
  var t, speed, score, coinCount, spawnGap, shake, last, targetLane;

  function reset() {
    targetLane = 1;
    player = { x: laneX(1), y: PLAYER_Y };
    cars = []; coins = []; particles = [];
    laneSpeed = [];
    for (var i = 0; i < LANES; i++) laneSpeed.push(rnd(110, 210));
    offset = 0; t = 0; speed = 260; score = 0; coinCount = 0; spawnGap = 120; shake = 0;
    roadside = [];
    for (var s = 0; s < 14; s++) roadside.push({ y: s * 48, side: s % 2, r: rnd(7, 13), shade: rnd(0.5, 1) });
  }
  reset();

  function show(title, text, btn) {
    ovTitle.innerHTML = title; ovText.innerHTML = text; goBtn.textContent = btn;
    overlay.hidden = false;
  }

  function start() {
    reset(); mode = 'play'; overlay.hidden = true; last = performance.now();
  }

  function pause() {
    if (mode !== 'play') return;
    mode = 'pause';
    show('Paused', 'Take a breath. Your run is waiting.', 'Resume');
  }
  function resume() { mode = 'play'; overlay.hidden = true; last = performance.now(); }

  function crash() {
    mode = 'over'; shake = 0.45;
    for (var i = 0; i < 28; i++) {
      var a = rnd(0, Math.PI * 2), v = rnd(60, 280);
      particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.4, 0.9), max: 0.9, c: i % 3 ? C.signal : C.paint });
    }
    var final = Math.floor(score);
    var isBest = final > best;
    if (isBest) {
      best = final; elBest.textContent = best;
      try { localStorage.setItem('midnight-highway-best', String(best)); } catch (e) {}
    }
    setTimeout(function () {
      show('Crashed', '<strong>' + final + '</strong> points &middot; ' + coinCount + ' coins' + (isBest ? '<br>New best score.' : '<br>Best: ' + best), 'Drive again');
    }, 700);
  }

  function move(d) {
    if (mode !== 'play') return;
    targetLane = Math.max(0, Math.min(LANES - 1, targetLane + d));
  }

  function spawn() {
    var free = [];
    for (var l = 0; l < LANES; l++) {
      var busy = false;
      for (var i = 0; i < cars.length; i++) if (cars[i].lane === l && cars[i].y < 170) busy = true;
      if (!busy) free.push(l);
    }
    var n = (Math.random() < 0.28 && t > 12) ? 2 : 1;
    var picked = [];
    while (n-- > 0 && free.length) {
      var k = Math.floor(Math.random() * free.length);
      picked.push(free.splice(k, 1)[0]);
    }
    picked.forEach(function (l) {
      cars.push({ lane: l, x: laneX(l), y: -CAR_H, color: BODY_COLORS[Math.floor(Math.random() * BODY_COLORS.length)], passed: false });
    });
    if (free.length && Math.random() < 0.45) {
      var cl = free[Math.floor(Math.random() * free.length)];
      coins.push({ x: laneX(cl), y: -60, spin: rnd(0, 6) });
    }
  }

  function hit(ax, ay, bx, by) {
    return Math.abs(ax - bx) < CAR_W - 8 && Math.abs(ay - by) < CAR_H - 10;
  }

  function update(dt) {
    t += dt;
    speed = Math.min(720, 260 + t * 7);
    offset += speed * dt;
    score += speed * dt / 18;

    player.x += (laneX(targetLane) - player.x) * Math.min(1, dt * 14);

    spawnGap -= speed * dt;
    if (spawnGap <= 0) {
      spawn();
      spawnGap = Math.max(120, rnd(170, 300) - t * 1.6);
    }

    for (var i = cars.length - 1; i >= 0; i--) {
      var c = cars[i];
      c.y += (speed - laneSpeed[c.lane]) * dt;
      if (!c.passed && c.y > player.y + CAR_H / 2) { c.passed = true; score += 10; }
      if (c.y > H + CAR_H) { cars.splice(i, 1); continue; }
      if (hit(player.x, player.y, c.x, c.y)) { crash(); return; }
    }
    for (var j = coins.length - 1; j >= 0; j--) {
      var co = coins[j];
      co.y += speed * dt; co.spin += dt * 6;
      if (co.y > H + 30) { coins.splice(j, 1); continue; }
      if (Math.abs(co.x - player.x) < 28 && Math.abs(co.y - player.y) < 44) {
        coins.splice(j, 1); coinCount++; score += 50;
        for (var p = 0; p < 8; p++) particles.push({ x: co.x, y: co.y, vx: rnd(-90, 90), vy: rnd(-120, 40), life: 0.45, max: 0.45, c: C.paint });
      }
    }
    for (var r = 0; r < roadside.length; r++) {
      roadside[r].y += speed * dt;
      if (roadside[r].y > H + 20) { roadside[r].y -= 14 * 48; roadside[r].r = rnd(7, 13); }
    }
  }

  function updateFx(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt);
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCar(cx, cy, color, isPlayer, tilt) {
    ctx.save();
    ctx.translate(cx, cy);
    if (tilt) ctx.rotate(tilt);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    rr(-CAR_W / 2 + 3, -CAR_H / 2 + 5, CAR_W, CAR_H, 9); ctx.fill();
    ctx.fillStyle = color;
    rr(-CAR_W / 2, -CAR_H / 2, CAR_W, CAR_H, 9); ctx.fill();
    ctx.fillStyle = 'rgba(8,10,16,0.82)';
    rr(-CAR_W / 2 + 6, -CAR_H / 2 + 14, CAR_W - 12, 14, 4); ctx.fill();
    rr(-CAR_W / 2 + 7, CAR_H / 2 - 24, CAR_W - 14, 10, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    rr(-CAR_W / 2 + 8, -CAR_H / 2 + 28, CAR_W - 16, 18, 3); ctx.fill();
    ctx.fillStyle = isPlayer ? '#fff6c9' : '#d8dbe4';
    ctx.fillRect(-CAR_W / 2 + 3, -CAR_H / 2 + 2, 8, 4);
    ctx.fillRect(CAR_W / 2 - 11, -CAR_H / 2 + 2, 8, 4);
    ctx.fillStyle = C.signal;
    ctx.fillRect(-CAR_W / 2 + 3, CAR_H / 2 - 6, 8, 4);
    ctx.fillRect(CAR_W / 2 - 11, CAR_H / 2 - 6, 8, 4);
    if (isPlayer) {
      ctx.fillStyle = C.paint;
      ctx.fillRect(-2, -CAR_H / 2 + 8, 4, CAR_H - 16);
    }
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 14, rnd(-1, 1) * shake * 14);

    ctx.fillStyle = C.verge; ctx.fillRect(-20, -20, W + 40, H + 40);

    for (var r = 0; r < roadside.length; r++) {
      var s = roadside[r];
      var x = s.side ? ROAD_X + LANES * LANE_W + 20 : ROAD_X - 20;
      ctx.fillStyle = 'rgba(40,70,60,' + (0.35 + s.shade * 0.4) + ')';
      ctx.beginPath(); ctx.arc(x + (s.side ? 4 : -4) * s.shade, s.y, s.r, 0, 6.283); ctx.fill();
    }

    ctx.fillStyle = C.asphalt; ctx.fillRect(ROAD_X, -20, LANES * LANE_W, H + 40);
    ctx.fillStyle = C.paint;
    ctx.fillRect(ROAD_X - 3, -20, 3, H + 40);
    ctx.fillRect(ROAD_X + LANES * LANE_W, -20, 3, H + 40);

    ctx.fillStyle = 'rgba(236,239,245,0.5)';
    var o = offset % 64;
    for (var l = 1; l < LANES; l++) {
      for (var y = -64 + o; y < H + 20; y += 64) ctx.fillRect(ROAD_X + l * LANE_W - 1.5, y, 3, 30);
    }

    for (var j = 0; j < coins.length; j++) {
      var c = coins[j];
      var w = Math.abs(Math.cos(c.spin)) * 11 + 2;
      ctx.fillStyle = C.paint;
      ctx.beginPath(); ctx.ellipse(c.x, c.y, w, 11, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#b8901c'; ctx.lineWidth = 2; ctx.stroke();
    }

    for (var i = 0; i < cars.length; i++) drawCar(cars[i].x, cars[i].y, cars[i].color, false, 0);

    if (mode !== 'over') {
      var tilt = (laneX(targetLane) - player.x) / 400;
      ctx.fillStyle = 'rgba(255,246,201,0.07)';
      ctx.beginPath();
      ctx.moveTo(player.x - 14, player.y - 34); ctx.lineTo(player.x - 34, player.y - 190);
      ctx.lineTo(player.x + 34, player.y - 190); ctx.lineTo(player.x + 14, player.y - 34); ctx.fill();
      drawCar(player.x, player.y, C.signal, true, tilt);
    }

    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    var g = ctx.createLinearGradient(0, 0, 0, 140);
    g.addColorStop(0, 'rgba(10,12,17,0.85)'); g.addColorStop(1, 'rgba(10,12,17,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 140);

    ctx.restore();
  }

  function hud() {
    elScore.textContent = Math.floor(score);
    elSpeed.textContent = mode === 'ready' ? 0 : Math.round(speed * 0.4);
    if (Math.floor(score) > best && mode === 'play') elBest.textContent = Math.floor(score);
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (mode === 'play') update(dt);
    if (mode === 'play' || mode === 'over') updateFx(dt);
    draw(); hud();
    requestAnimationFrame(frame);
  }
  last = performance.now();
  requestAnimationFrame(frame);

  goBtn.addEventListener('click', function () { mode === 'pause' ? resume() : start(); });
  goBtn.addEventListener('keydown', function (e) { e.stopPropagation(); });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); move(-1); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); move(1); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { mode === 'pause' ? resume() : pause(); }
    else if ((k === ' ' || k === 'Enter') && (mode === 'ready' || mode === 'over')) { e.preventDefault(); start(); }
  });

  function bindPad(id, d) {
    document.getElementById(id).addEventListener('pointerdown', function (e) { e.preventDefault(); move(d); });
  }
  bindPad('padL', -1); bindPad('padR', 1);

  var sx = null;
  cv.addEventListener('pointerdown', function (e) { sx = e.clientX; });
  cv.addEventListener('pointerup', function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 24) move(dx > 0 ? 1 : -1);
    else { var rect = cv.getBoundingClientRect(); move(e.clientX < rect.left + rect.width / 2 ? -1 : 1); }
  });
  cv.addEventListener('pointercancel', function () { sx = null; });

  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
})();
</script>
</body>
</html>
